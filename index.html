<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자연 놀이 추천 앱</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container nav">
      <h1 class="logo">Nature Play</h1>
      <nav class="menu">
        <a href="#home">홈</a>
        <a href="#service">서비스 소개</a>
        <a href="#recommend">AI 추천</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="container">
        <h2>아이와 함께하는 자연 놀이를 더 쉽게</h2>
        <p>
          장소, 나이, 원하는 분위기를 입력하면
          AI가 우리 가족에게 맞는 자연 놀이를 추천해드립니다.
        </p>
        <a href="#recommend" class="btn">지금 추천 받기</a>
      </div>
    </section>

    <section id="service" class="section">
      <div class="container">
        <h2>서비스 소개</h2>
        <div class="card-grid">
          <div class="card">
            <h3>맞춤 추천</h3>
            <p>입력한 조건에 맞는 자연 놀이를 AI가 바로 추천합니다.</p>
          </div>
          <div class="card">
            <h3>쉬운 실천</h3>
            <p>준비물, 진행 방법, 안전 팁까지 한 번에 확인할 수 있습니다.</p>
          </div>
          <div class="card">
            <h3>모바일 대응</h3>
            <p>휴대폰에서도 편하게 사용할 수 있는 반응형 웹입니다.</p>
          </div>
        </div>
      </div>
    </section>

    <section id="recommend" class="section recommend-section">
      <div class="container">
        <h2>AI 자연 놀이 추천</h2>
        <div class="form-card">
          <label for="location">놀이 장소</label>
          <input id="location" type="text" placeholder="예: 공원, 숲길, 아파트 앞 마당" />

          <label for="age">아이 나이</label>
          <input id="age" type="text" placeholder="예: 5세" />

          <label for="theme">원하는 테마/분위기</label>
          <input id="theme" type="text" placeholder="예: 조용한 관찰 놀이, 활동적인 놀이" />

          <button id="recommendBtn" class="btn">추천 받기</button>

          <p id="status" class="status"></p>
          <div id="result" class="result-box"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 Nature Play App</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
